<h2 class="header-title">Doctors</h2>

<div class="toolbar">
  <div class="toolbar-left">
    <form (ngSubmit)="search()" class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" name="specialty" [(ngModel)]="specialty" placeholder="Search by specialty…" />
    </form>
    <button type="button" (click)="browseAll()" [disabled]="loading">
      <i class="fa-solid fa-rotate-left"></i> Show all
    </button>
  </div>
  <button type="submit" class="create-btn" (click)="search()" [disabled]="loading || !specialty.trim()">
    <i class="fa-solid fa-magnifying-glass"></i> Search
  </button>
</div>

<p class="error" *ngIf="error">{{ error }}</p>
<p class="muted" *ngIf="loading">Loading…</p>

<div class="cards-grid" *ngIf="!loading && results.length">
  <div class="entity-card" *ngFor="let doctor of results">
    <div class="entity-header">
      <div class="entity-avatar">{{ initials(doctor) }}</div>
      <div class="entity-info">
        <h4>Dr. {{ doctor.firstName }} {{ doctor.lastName }}</h4>
        <p>{{ doctor.specialty }}</p>
      </div>
    </div>
    <p class="muted" style="margin: 0;">{{ doctor.departmentName }}</p>
    <div class="entity-footer">
      <code>{{ doctor.id.slice(0, 8) }}…</code>
      <a [routerLink]="['/appointments']" [queryParams]="{ doctorId: doctor.id }">
        <button type="button">Book</button>
      </a>
    </div>
  </div>
</div>

<div class="empty-state" *ngIf="!loading && !results.length">
  <i class="fa-solid fa-user-doctor"></i>
  <p *ngIf="searched">No doctors found for "{{ specialty }}".</p>
  <p *ngIf="!searched">No doctors in the system yet.</p>
</div>
