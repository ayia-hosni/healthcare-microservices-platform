# __RESOLVER_IP__ is substituted at container start (see docker/15-resolve-cluster-dns.sh)
# with the cluster DNS IP from /etc/resolv.conf. Using it + a variable in proxy_pass forces
# nginx to resolve backend Service hostnames per-request instead of once at config load — a
# static proxy_pass target that isn't resolvable yet (Service created after this pod boots,
# a restart, etc.) makes nginx refuse to start at all.
resolver __RESOLVER_IP__ valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to each backend service, mirroring proxy.conf.json used by
    # `ng serve` in local dev. This is what lets a browser that only ever talks to this pod
    # reach four different backend Services without hitting CORS (identity-service's CORS
    # config only allows a fixed production origin; the other services don't enable CORS at
    # all).
    location /api/v1/auth/ {
        set $upstream http://identity-service.healthcare-platform.svc.cluster.local:8081;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/patients/ {
        set $upstream http://patient-service.healthcare-platform.svc.cluster.local:8082;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/doctors/ {
        set $upstream http://doctor-service.healthcare-platform.svc.cluster.local:8083;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/appointments/ {
        set $upstream http://appointment-service.healthcare-platform.svc.cluster.local:8084;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
