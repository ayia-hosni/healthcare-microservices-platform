server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — API requests never reach this container; the Kubernetes Ingress
    # (infra/k8s/base/ingress.yaml) routes /api/v1/** and /graphql** straight to the
    # owning backend service before traffic gets here. See docs/adr/0001-api-gateway-ingress.md.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
