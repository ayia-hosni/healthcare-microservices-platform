// Dev-only static JAAS file — minimal on purpose. Per-service SASL/PLAIN credentials for
// real client authentication live in KAFKA_LISTENER_NAME_SASL_SSL_PLAIN_SASL_JAAS_CONFIG in
// docker-compose.yml instead (see docs/adr/0006). This file exists only because Kafka 3.x's
// BrokerToControllerChannelManager (inter-broker metadata channel, used even in legacy
// ZooKeeper mode) hard-requires a 'KafkaServer' entry from the static JAAS mechanism — the
// broker's own inter-broker identity, nothing more.
KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="local-dev-kafka-admin-pass"
    user_admin="local-dev-kafka-admin-pass";
};
