global:
  scrape_interval: 15s

scrape_configs:
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8081"]

  - job_name: patient-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["patient-service:8082"]

  - job_name: doctor-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["doctor-service:8083"]

  - job_name: appointment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["appointment-service:8084"]

  - job_name: emr-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["emr-service:8085"]

  - job_name: billing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["billing-service:8086"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8087"]

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["audit-service:8088"]

  - job_name: analytics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["analytics-service:8089"]
