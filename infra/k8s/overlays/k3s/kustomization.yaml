apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-node k3s host (Traefik ingress, local-path storage). Reuses the dev overlay wholesale —
# same trimmed resources, relaxed probes, plaintext Kafka, in-cluster datastores — and changes
# only what differs from minikube: images come from GHCR (public packages, so no pull secret) instead of minikube's docker daemon,
# and the Ingress is served by Traefik instead of ingress-nginx.
#
# .github/workflows/ci.yml's deploy job runs `kustomize edit set image` (pins every app image to
# ghcr.io/<owner>/healthcare-platform/<svc>:<sha>) and adds the CORS patch for the public origin
# before piping `kustomize build` to the server. Committed as-is it still builds, using :latest.
resources:
  - ../dev

# The VPS has ~1 vCPU / 4Gi and can't be resized. All 10 JVMs plus the datastores overloaded it
# (load 13, swap full, k3s itself crashed), so only the core request path runs here. The
# five below are deployed but scaled to 0; raise a count to 1 to bring one back (the restart
# loop in ci.yml skips them, keep its service list in step).
replicas:
  - name: analytics-service
    count: 0
  - name: audit-service
    count: 0
  - name: notification-service
    count: 0
  - name: billing-service
    count: 0
  - name: emr-service
    count: 0
  # Only emr-service uses MinIO, and docker.io/minio/minio:latest is no longer pullable
  # (insufficient_scope — upstream stopped publishing there; quay.io/minio/minio is the
  # replacement if EMR is ever brought back).
  - name: minio
    count: 0

patches:
  - path: patches/ingress-traefik.yaml
    target: { kind: Ingress, name: platform-gateway }

  # The server's postgres volume was provisioned at 10Gi; a PVC can't shrink, so dev's 1Gi would make
  # `kubectl apply` fail with "field can not be less than status.capacity".
  - target: { kind: PersistentVolumeClaim, name: postgres-data }
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi

  - path: patches/small-node-resources.yaml
    target:
      kind: Deployment
      name: "(identity|patient|doctor|appointment|emr|billing|notification|audit|analytics)-service|graphql-gateway"

  - path: patches/slow-start.yaml
    target:
      kind: Deployment
      name: "(identity|patient|doctor|appointment|emr|billing|notification|audit|analytics)-service|graphql-gateway"
