# Single external entry point for the platform. Routes REST paths straight to their owning
# service and exposes the GraphQL BFF (graphql-gateway) alongside them — see
# docs/adr/0001-api-gateway-ingress.md for why this exists and why it's a partial adoption
# (the frontend still calls these REST paths directly; it doesn't consume GraphQL yet).
#
# No `host:` restriction (catch-all) so this works locally without editing /etc/hosts.
# ingressClassName "nginx" matches minikube's built-in ingress-nginx addon and the default
# IngressClass of the standard ingress-nginx Helm chart on a real cluster — the manifest
# itself is portable even though no controller is installed for the AKS environment yet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-gateway
  namespace: healthcare-platform
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 8081
          - path: /api/v1/patients
            pathType: Prefix
            backend:
              service:
                name: patient-service
                port:
                  number: 8082
          - path: /api/v1/doctors
            pathType: Prefix
            backend:
              service:
                name: doctor-service
                port:
                  number: 8083
          - path: /api/v1/appointments
            pathType: Prefix
            backend:
              service:
                name: appointment-service
                port:
                  number: 8084
          - path: /api/v1/invoices
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port:
                  number: 8086
          - path: /api/v1/billing
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port:
                  number: 8086
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: graphql-gateway
                port:
                  number: 8090
          - path: /graphiql
            pathType: Prefix
            backend:
              service:
                name: graphql-gateway
                port:
                  number: 8090
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
