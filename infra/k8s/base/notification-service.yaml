apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: healthcare-platform
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: healthcare-platform/notification-service:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DB_HOST
              value: "postgres.healthcare-platform.svc.cluster.local"
            - name: DB_NAME
              value: "notification_db"
            - name: DB_USER
              value: "notification_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_SASL_USERNAME_NOTIFICATION
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: KAFKA_SASL_PASSWORD_NOTIFICATION
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: healthcare-platform
spec:
  selector:
    app: notification-service
  ports:
    - port: 8087
      targetPort: 8087
  type: ClusterIP
