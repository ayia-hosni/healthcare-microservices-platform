apiVersion: apps/v1
kind: Deployment
metadata:
  name: emr-service
  namespace: healthcare-platform
  labels:
    app: emr-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emr-service
  template:
    metadata:
      labels:
        app: emr-service
    spec:
      containers:
        - name: emr-service
          image: healthcare-platform/emr-service:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DB_HOST
              value: "postgres.healthcare-platform.svc.cluster.local"
            - name: DB_NAME
              value: "emr_db"
            - name: DB_USER
              value: "emr_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_SASL_USERNAME_EMR
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: KAFKA_SASL_PASSWORD_EMR
            - name: MINIO_ENDPOINT
              value: "http://minio.healthcare-platform.svc.cluster.local:9000"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: emr-service
  namespace: healthcare-platform
spec:
  selector:
    app: emr-service
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
