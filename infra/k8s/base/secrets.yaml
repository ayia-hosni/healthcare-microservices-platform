apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: healthcare-platform
type: Opaque
stringData:
  # Placeholder values ONLY — real deployments inject these via a secrets manager
  # (e.g. External Secrets Operator pulling from AWS Secrets Manager / Vault), never
  # committed to source control.
  # RS256 signing keypair for identity-service (PEM, base64 DER also accepted). Generate with
  # `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048` then derive the public key.
  # Only identity-service consumes these; every other service verifies via the public JWKS.
  JWT_RSA_PRIVATE_KEY: "replace-with-a-real-rsa-private-key-in-your-secrets-manager"
  JWT_RSA_PUBLIC_KEY: "replace-with-the-matching-rsa-public-key"
  # PHI field encryption (see backend/common/.../crypto/) — patient-service and emr-service
  # need FIELD_ENCRYPTION_KEY only; identity-service additionally needs
  # FIELD_ENCRYPTION_HMAC_KEY for its login-email blind index. Both must be base64-encoded,
  # 32 raw bytes each (AES-256) — e.g. `openssl rand -base64 32`.
  FIELD_ENCRYPTION_KEY: "replace-with-a-real-base64-32-byte-key-in-your-secrets-manager"
  FIELD_ENCRYPTION_HMAC_KEY: "replace-with-a-real-base64-32-byte-key-in-your-secrets-manager"
  DB_PASSWORD: "replace-with-a-real-secret-in-your-secrets-manager"
  RABBITMQ_USER: "replace-with-a-real-secret-in-your-secrets-manager"
  RABBITMQ_PASSWORD: "replace-with-a-real-secret-in-your-secrets-manager"
  # Kafka SASL/PLAIN credentials, one per service (see docs/adr/0006 for why per-service
  # rather than shared — they're the identity ACLs get attached to next). Whoever provisions
  # the cluster's Kafka broker (Strimzi/Bitnami operator, not this repo) must create matching
  # users; this repo only wires the client side.
  KAFKA_SASL_PASSWORD_IDENTITY: "replace-with-a-real-secret-in-your-secrets-manager"
  KAFKA_SASL_PASSWORD_PATIENT: "replace-with-a-real-secret-in-your-secrets-manager"
  KAFKA_SASL_PASSWORD_DOCTOR: "replace-with-a-real-secret-in-your-secrets-manager"
  KAFKA_SASL_PASSWORD_APPOINTMENT: "replace-with-a-real-secret-in-your-secrets-manager"
  KAFKA_SASL_PASSWORD_EMR: "replace-with-a-real-secret-in-your-secrets-manager"
  KAFKA_SASL_PASSWORD_BILLING: "replace-with-a-real-secret-in-your-secrets-manager"
  KAFKA_SASL_PASSWORD_NOTIFICATION: "replace-with-a-real-secret-in-your-secrets-manager"
  KAFKA_SASL_PASSWORD_AUDIT: "replace-with-a-real-secret-in-your-secrets-manager"
  KAFKA_SASL_PASSWORD_ANALYTICS: "replace-with-a-real-secret-in-your-secrets-manager"
