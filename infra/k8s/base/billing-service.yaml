apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: healthcare-platform
  labels:
    app: billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: healthcare-platform/billing-service:latest
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DB_HOST
              value: "postgres.healthcare-platform.svc.cluster.local"
            - name: DB_NAME
              value: "billing_db"
            - name: DB_USER
              value: "billing_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_SASL_USERNAME_BILLING
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: KAFKA_SASL_PASSWORD_BILLING
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: healthcare-platform
spec:
  selector:
    app: billing-service
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
