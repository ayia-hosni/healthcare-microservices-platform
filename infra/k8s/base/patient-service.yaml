apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: healthcare-platform
  labels:
    app: patient-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: healthcare-platform/patient-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DB_HOST
              value: "postgres.healthcare-platform.svc.cluster.local"
            - name: DB_NAME
              value: "patient_db"
            - name: DB_USER
              value: "patient_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_SASL_USERNAME_PATIENT
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: KAFKA_SASL_PASSWORD_PATIENT
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: healthcare-platform
spec:
  selector:
    app: patient-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
