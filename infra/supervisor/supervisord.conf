# Local dev supervisor config: runs every backend Spring Boot service as a native
# `java -jar`, so you can iterate on one service and see it come up in seconds instead of
# through a Docker build + kubectl deploy cycle. Datastores are NOT managed here — bring
# those up separately: `docker compose up -d postgres redis minio payer-mock`, plus two
# standalone containers run outside compose because their compose definitions hit local
# issues: rabbitmq-supervisor-dev (RabbitMQ, worked around an anonymous-volume EACCES bug
# on .erlang.cookie by using a named volume) and kafka-supervisor-dev (Kafka, PLAINTEXT/KRaft
# instead of compose's SASL_SSL broker, whose internal SslFactory self-test failed here with
# "no available authentication scheme" even against freshly regenerated, verified-matching
# certs). All Kafka-using services below set SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
# to match, and skip the SASL/truststore env vars entirely since PLAINTEXT ignores them.
#
# All app ports here are "2" + the service's normal port (8081 -> 28081, grpc 9082 -> 29082,
# etc.) specifically so they can't collide with anything already bound to the standard
# 808x/908x range (a kubectl port-forward, another checkout of this repo, docker-compose
# itself if it's ever brought up alongside this). Datastore ports are left at their
# docker-compose defaults since only one instance of each runs and the app configs already
# default to localhost:<standard-port> for those.
#
# Usage:
#   supervisord -c infra/supervisor/supervisord.conf
#   supervisorctl -c infra/supervisor/supervisord.conf status
#   supervisorctl -c infra/supervisor/supervisord.conf tail -f analytics-service
#   supervisorctl -c infra/supervisor/supervisord.conf stop all
#   supervisorctl -c infra/supervisor/supervisord.conf shutdown

[unix_http_server]
file=%(here)s/supervisor.sock

[supervisord]
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/supervisord.pid
childlogdir=%(here)s/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/supervisor.sock

[group:backend]
programs=identity-service,patient-service,doctor-service,appointment-service,emr-service,billing-service,notification-service,audit-service,analytics-service,graphql-gateway

# --- shared settings every [program:*] below repeats ---
# autorestart=true + startretries so a service that OOMs or crashes mid-boot (same failure
# mode we were just chasing in k8s) comes back on its own instead of needing a manual restart.
# startsecs=15 covers a normal Spring Boot cold start; anything that exits before that counts
# as a failed start, not a clean stop.

[program:identity-service]
command=/usr/local/Cellar/openjdk@21/21.0.12/libexec/openjdk.jdk/Contents/Home/bin/java -Xms128m -Xmx384m -XX:TieredStopAtLevel=1 -jar "%(here)s/../../backend/identity-service/target/identity-service-1.0.0-SNAPSHOT.jar"
directory=%(here)s/../..
autostart=true
autorestart=true
startsecs=15
startretries=5
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=%(here)s/logs/identity-service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
environment=SERVER_PORT="28081",DB_PORT="25432",REDIS_PORT="26379",SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL="PLAINTEXT",JWT_SECRET="local-dev-secret-key-please-change-in-production-32bytes"

