server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    username: ${DB_USER:identity_user}
    password: ${DB_PASSWORD:identity_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:/etc/kafka/certs/kafka.truststore.p12}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:changeit}
      ssl.truststore.type: PKCS12

app:
  jwt:
    # Where other services reach this one; stamped into every token's `iss` claim and the
    # OpenID discovery document. Override to the in-cluster URL in docker-compose / k8s.
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    rsa:
      # Throwaway dev RS256 keypair (base64 DER, PEM armor stripped) — insecure placeholder,
      # same convention as field-encryption.key below. Real deployments inject
      # JWT_RSA_PRIVATE_KEY / JWT_RSA_PUBLIC_KEY from a secrets manager.
      private-key: ${JWT_RSA_PRIVATE_KEY:}
      public-key: ${JWT_RSA_PUBLIC_KEY:}
  bootstrap:
    # Dev/local only: seeds admin@healthplatform.local / SeedStaff-2026! on startup so there's
    # a way in before any other admin exists. Unset this in real deployments.
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.example-health.com}
  field-encryption:
    # 32 zero bytes, base64 — insecure placeholders, same pattern as app.jwt.secret above.
    # Real deployments override via FIELD_ENCRYPTION_KEY/FIELD_ENCRYPTION_HMAC_KEY (see
    # docker-compose.yml / infra/k8s/base/secrets.yaml). Both must decode to exactly 32
    # bytes — see AesGcmCipher/BlindIndexHasher in common/crypto. hmac-key is distinct from
    # key deliberately: two different cryptographic purposes (encrypting the email column
    # vs. the deterministic login lookup hash) should never share a key.
    key: ${FIELD_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    hmac-key: ${FIELD_ENCRYPTION_HMAC_KEY:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: identity-service

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
