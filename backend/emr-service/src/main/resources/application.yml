server:
  port: 8085

spring:
  application:
    name: emr-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emr_db}
    username: ${DB_USER:emr_user}
    password: ${DB_PASSWORD:emr_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:/etc/kafka/certs/kafka.truststore.p12}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:changeit}
      ssl.truststore.type: PKCS12
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    # Verify identity-service RS256 access tokens against its JWKS (no signing secret here).
    jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/oauth2/jwks}
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.example-health.com}
  field-encryption:
    # 32 zero bytes, base64 — insecure placeholder, same pattern as app.jwt.secret above.
    # Real deployments override via FIELD_ENCRYPTION_KEY (see docker-compose.yml /
    # infra/k8s/base/secrets.yaml). Must decode to exactly 32 bytes (AES-256) — see
    # AesGcmCipher in common/crypto.
    key: ${FIELD_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# REST client (RestClientConfig/DownstreamServicesProperties) for patient lookups. Default
# matches running each service directly on localhost, same pattern as
# appointment-service/graphql-gateway's downstream service URLs; docker-compose.yml/k8s
# override the host to the service DNS name.
services:
  patient:
    base-url: ${PATIENT_SERVICE_URL:http://localhost:8082}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: emr-attachments

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: emr-service
