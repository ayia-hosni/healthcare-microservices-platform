syntax = "proto3";

package com.healthplatform.common.grpc;

option java_package = "com.healthplatform.common.grpc";
option java_multiple_files = true;
option java_outer_classname = "DoctorDirectoryProto";

// Wider read surface than DoctorLookup (doctor_lookup.proto), added per ADR-0004 for callers
// that need the full doctor record rather than an existence check — today that's
// graphql-gateway's `doctor` field. Deliberately a separate service rather than widening
// DoctorLookup: one contract, one purpose, per this repo's own precedent (ADR-0003).
service DoctorDirectory {
  rpc GetDoctor (DoctorDirectoryRequest) returns (DoctorDirectoryResponse);
}

message DoctorDirectoryRequest {
  string doctor_id = 1;
}

message DoctorDirectoryResponse {
  bool exists = 1;
  string id = 2;
  string first_name = 3;
  string last_name = 4;
  string specialty = 5;
  string department_name = 6;
}
