  docker-build-push:
    # TODO: restore `needs: [backend-unit-tests, backend-integration-tests, frontend-build-test]`
    # once the test jobs above are fixed and re-enabled.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - patient-service
          - doctor-service
          - appointment-service
          - emr-service
          - billing-service
          - notification-service
          - audit-service
          - analytics-service
          - graphql-gateway
          - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires lowercase repository paths.
      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/healthcare-platform/${{ matrix.service }}" >> "$GITHUB_ENV"
      - name: Build and push (backend service)
        if: matrix.service != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Build and push (frontend)
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Deploys to the single-node k3s host. The k3s API is never exposed: the runner SSHes in and
  # pipes manifests to the server's own kubectl.
  #
  # Required repo configuration (Settings > Secrets and variables > Actions):
  #   secrets.DEPLOY_SSH_KEY         private key whose public half is in the server's authorized_keys
  #   secrets.DEPLOY_KNOWN_HOSTS     output of `ssh-keyscan -t ed25519 <host>` (pins the host key)
  #   vars.DEPLOY_HOST / DEPLOY_USER SSH target (e.g. srv2053232 host/IP, root)
  #   vars.PUBLIC_ORIGIN             browser origin of the frontend, e.g. https://health.example.com
  #   secrets.JWT_RSA_PRIVATE_KEY / JWT_RSA_PUBLIC_KEY / FIELD_ENCRYPTION_KEY /
  #   secrets.FIELD_ENCRYPTION_HMAC_KEY   optional; when set they replace the dev overlay's
  #                                       publicly-known keys (see the "Harden secrets" step)
  deploy:
    needs: [docker-build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-k3s
      cancel-in-progress: false
    env:
      SSH_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      KUBECTL: KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' > ~/.ssh/config
      - name: Render manifests
        working-directory: infra/k8s/overlays/k3s
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in identity-service patient-service doctor-service \
                     appointment-service emr-service billing-service \
                     notification-service audit-service analytics-service \
                     graphql-gateway frontend; do
            kustomize edit set image \
              "healthcare-platform/$svc=${REGISTRY}/${owner}/healthcare-platform/$svc:${GITHUB_SHA}"
          done
          # Spring rejects cross-origin requests from anything not listed here (bare 403).
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: platform-config\n  namespace: healthcare-platform\ndata:\n  CORS_ALLOWED_ORIGINS: "%s"\n' \
            "${{ vars.PUBLIC_ORIGIN }}" > patches/cors.yaml
          kustomize edit add patch --path patches/cors.yaml
          kustomize build . > "$RUNNER_TEMP/manifests.yaml"
      - name: Ensure namespace
        run: ssh "$SSH_TARGET" "$KUBECTL create namespace healthcare-platform --dry-run=client -o yaml | $KUBECTL apply -f -"
      - name: Apply manifests
        run: |
          ssh "$SSH_TARGET" "$KUBECTL apply -f -" < "$RUNNER_TEMP/manifests.yaml"
      - name: Harden secrets
        # The dev overlay ships a public RSA keypair and encryption keys. Overwrite them when
        # real ones are configured. Merge-patch only touches these keys, so DB/RabbitMQ
        # passwords stay in step with the already-initialised datastores. NB: rotating
        # FIELD_ENCRYPTION_* makes previously stored encrypted fields unreadable.
        run: |
          [ -n "$JWT_RSA_PRIVATE_KEY" ] || { echo 'No real keys configured; leaving dev overlay secrets'; exit 0; }
          python3 - <<'PY' | ssh "$SSH_TARGET" "$KUBECTL -n healthcare-platform patch secret platform-secrets --type=merge --patch-file=/dev/stdin"
          import json, os
          keys = ["JWT_RSA_PRIVATE_KEY", "JWT_RSA_PUBLIC_KEY", "FIELD_ENCRYPTION_KEY", "FIELD_ENCRYPTION_HMAC_KEY"]
          print(json.dumps({"stringData": {k: os.environ[k] for k in keys}}))
          PY
        env:
          JWT_RSA_PRIVATE_KEY: ${{ secrets.JWT_RSA_PRIVATE_KEY }}
          JWT_RSA_PUBLIC_KEY: ${{ secrets.JWT_RSA_PUBLIC_KEY }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          FIELD_ENCRYPTION_HMAC_KEY: ${{ secrets.FIELD_ENCRYPTION_HMAC_KEY }}
      - name: Restart workloads and wait for rollouts
        run: |
          # Secrets/ConfigMaps are consumed as env vars, so changes need a restart; a no-op
          # restart on an unchanged sha is cheap compared to debugging stale config.
          ssh "$SSH_TARGET" bash -s <<'REMOTE'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          ns=healthcare-platform
          svcs="identity-service patient-service doctor-service appointment-service emr-service billing-service notification-service audit-service analytics-service graphql-gateway frontend"
          for s in $svcs; do kubectl -n $ns rollout restart deployment/$s; done
          for s in $svcs; do
            kubectl -n $ns rollout status deployment/$s --timeout=600s || {
              kubectl -n $ns get pods; kubectl -n $ns describe pod -l app=$s | tail -30; exit 1; }
          done
          REMOTE
